plugins {
    id 'java'
}

group = 'com.vendor'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

jar {
    archiveBaseName = 'skey-loader'
    archiveFileName = 'skey-loader.jar'
    manifest {
        attributes 'Main-Class': 'com.vendor.skey.JarLauncher'
    }
}
