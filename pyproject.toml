[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "software-dongle-encryption"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "typer",
  "PyYAML",
  "cryptography",
  "PySide6>=6.7,<7",
]

[project.scripts]
skey-protect = "skeyprotect.cli:app"
skey-server = "skeyserver.app:main"
skey-studio = "skeystudio.app:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
skeyprotect = ["templates/*.yaml"]
skeystudio = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
