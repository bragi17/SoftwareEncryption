[package]
name = "skey-ffi"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
skey-core = { path = "../skey-core" }
zeroize = "1"

[dev-dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
